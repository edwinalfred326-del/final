<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Clientes</title>

<style>
    body {
        font-family: Arial;
        background: #f4f6f9;
        padding: 20px;
    }

    h1 {
        text-align: center;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
    }

    input, select, button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
    }

    button {
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
    }

    .cliente {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        margin-top: 10px;
        border-radius: 5px;
        border: 1px solid #ddd;
    }

    .cliente img {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
    }

    .pagado {
        background: #d4edda;
    }

    .no-pagado {
        background: #fff3cd;
    }

    .lista-roja {
        background: #f8d7da !important;
        border: 2px solid red;
    }
</style>

</head>

<body>

<h1>Registro de Clientes</h1>

<div class="container">

    <input type="text" id="nombre" placeholder="Nombre completo">
    <input type="text" id="cedula" placeholder="000-0000000-0">
    <input type="file" id="foto" accept="image/*">

    <select id="estadoPago">
        <option value="pagado">Pagado</option>
        <option value="no-pagado">No pagado</option>
    </select>

    <select id="listaRoja">
        <option value="no">Cliente normal</option>
        <option value="si">Lista roja</option>
    </select>

    <button onclick="agregarCliente()">Agregar Cliente</button>

    <div id="listaClientes"></div>

</div>

<script>
let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

function validarCedula(cedula) {
    const regex = /^\d{3}-\d{7}-\d{1}$/;
    return regex.test(cedula);
}

function agregarCliente() {
    const nombre = document.getElementById("nombre").value;
    const cedula = document.getElementById("cedula").value;
    const fotoInput = document.getElementById("foto");
    const estadoPago = document.getElementById("estadoPago").value;
    const listaRoja = document.getElementById("listaRoja").value;

    if (!nombre || !cedula || !fotoInput.files[0]) {
        alert("Completa todos los campos");
        return;
    }

    if (!validarCedula(cedula)) {
        alert("Cédula inválida");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
        const cliente = {
            nombre,
            cedula,
            foto: e.target.result,
            estadoPago,
            listaRoja
        };

        clientes.push(cliente);
        localStorage.setItem("clientes", JSON.stringify(clientes));

        mostrarClientes();
        limpiarCampos();
    };

    reader.readAsDataURL(fotoInput.files[0]);
}

function mostrarClientes() {
    const lista = document.getElementById("listaClientes");
    lista.innerHTML = "";

    clientes.forEach(cliente => {
        const div = document.createElement("div");

        let clase = "cliente ";

        if (cliente.listaRoja === "si") {
            clase += "lista-roja";
        } else {
            clase += cliente.estadoPago;
        }

        div.className = clase;

        div.innerHTML = `
            <img src="${cliente.foto}">
            <div>
                <strong>${cliente.nombre}</strong><br>
                ${cliente.cedula}<br>
                Estado: ${cliente.estadoPago}<br>
                ${cliente.listaRoja === "si" ? "⚠️ LISTA ROJA" : ""}
            </div>
        `;

        lista.appendChild(div);
    });
}

function limpiarCampos() {
    document.getElementById("nombre").value = "";
    document.getElementById("cedula").value = "";
    document.getElementById("foto").value = "";
}

mostrarClientes();
</script>

</body>
</html>
